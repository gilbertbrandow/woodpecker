name: ci

on:
  pull_request:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: lint
        run: npx --yes markdownlint-cli2
          "*.md" "docs/**/*.md" "deploy/README.md"
          ".github/**/*.md" "backend/AGENTS.md" "frontend/AGENTS.md" "pipeline/AGENTS.md" "pipeline/README.md" "pipeline/data/README.md"

  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: lint
        working-directory: backend
        run: make lint

  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: woodpecker
          POSTGRES_PASSWORD: woodpecker
          POSTGRES_DB: woodpecker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Check Alembic migrations
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret
          DATABASE_URL: postgresql://woodpecker:woodpecker@localhost:5432/woodpecker_test
        run: .venv/bin/flask --app app db upgrade

      - name: test
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret
          DATABASE_URL: postgresql://woodpecker:woodpecker@localhost:5432/woodpecker_test
        run: make test-integration

  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: "frontend/.nvmrc"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: lint
        working-directory: frontend
        run: make lint

  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: "frontend/.nvmrc"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: test
        working-directory: frontend
        run: make test

  build-backend:
    name: Build backend image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build --target prod -t woodpecker-backend:ci backend/

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: woodpecker-backend:ci
          format: sarif
          output: trivy.sarif
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          cache: "true"

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
          category: backend

  build-frontend:
    name: Build frontend image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Check Node version consistency
        run: bash frontend/scripts/check-node-version.sh

      - name: Build
        run: docker build --target build -t woodpecker-frontend:ci frontend/

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: woodpecker-frontend:ci
          format: sarif
          output: trivy.sarif
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          cache: "true"

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
          category: frontend

  build-backup:
    name: Build backup image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -t woodpecker-backup:ci deploy/backup/

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: woodpecker-backup:ci
          format: sarif
          output: trivy.sarif
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          cache: "true"

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
          category: backup

  build-pipeline:
    name: Build pipeline images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Build base image
        run: docker build -f pipeline/base.Dockerfile -t woodpecker-pipeline-base .

      - name: Scan base image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: woodpecker-pipeline-base
          format: sarif
          output: trivy-base.sarif
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          cache: "true"

      - name: Upload base image Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-base.sarif
          category: pipeline-base

      - name: Build openings image
        run: docker build -f pipeline/openings/Dockerfile -t woodpecker-pipeline-openings .

      - name: Scan openings image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: woodpecker-pipeline-openings
          format: sarif
          output: trivy-openings.sarif
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          cache: "true"

      - name: Upload openings image Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-openings.sarif
          category: pipeline-openings

      - name: Build lichess-tactics image
        run: docker build -f pipeline/sources/lichess_tactics/Dockerfile -t woodpecker-pipeline-lichess-tactics .

      - name: Scan lichess-tactics image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: woodpecker-pipeline-lichess-tactics
          format: sarif
          output: trivy-lichess-tactics.sarif
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          cache: "true"

      - name: Upload lichess-tactics image Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-lichess-tactics.sarif
          category: pipeline-lichess-tactics
